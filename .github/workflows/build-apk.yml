# Builds the Android app on GitHub's machines, where Google's Android and
# Firebase downloads work. Run it from the Actions tab ("Run workflow"), or it
# runs by itself on every push to main. The APKs are attached to the run.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      # gradle.properties is tuned for the Windows machine (temp files on D:).
      - name: Gradle settings for this machine
        run: sed -i -e 's# -Djava.io.tmpdir=D:/dev-cache/tmp##' -e 's/-Xmx8G/-Xmx5G/' android/gradle.properties

      # Repository secrets (Settings > Secrets and variables > Actions).
      # The Firebase ones may stay empty: the app then builds without push.
      - name: env.json from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY secrets first."
            exit 1
          fi
          jq -n \
            --arg SUPABASE_URL "$SUPABASE_URL" \
            --arg SUPABASE_PUBLISHABLE_KEY "$SUPABASE_PUBLISHABLE_KEY" \
            --arg FIREBASE_API_KEY "$FIREBASE_API_KEY" \
            --arg FIREBASE_APP_ID "$FIREBASE_APP_ID" \
            --arg FIREBASE_SENDER_ID "$FIREBASE_SENDER_ID" \
            --arg FIREBASE_PROJECT_ID "$FIREBASE_PROJECT_ID" \
            '$ARGS.named' > env.json

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release --split-per-abi --dart-define-from-file=env.json

      - uses: actions/upload-artifact@v4
        with:
          name: ammerha-apk
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 14
